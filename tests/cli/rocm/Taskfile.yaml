version: "3"

tasks:
  default:
    deps: [test]

  test:
    desc: Validate the go-rocm AX-10 CLI artifact driver.
    dir: ../../..
    cmds:
      - |
        export GOWORK=off
        export GOCACHE="${GOCACHE:-/tmp/go-rocm-gocache}"
        export GOMODCACHE="${GOMODCACHE:-/tmp/go-rocm-gomodcache}"
        mkdir -p "$GOCACHE" "$GOMODCACHE"
        bin="$(mktemp -t core-rocm.XXXXXX)"
        trap 'rm -f "$bin"' EXIT
        go build -o "$bin" ./tests/cli/rocm
        "$bin"

  driver:
    desc: Run the go-rocm AX-10 driver directly.
    dir: ../../..
    cmds:
      - go run ./tests/cli/rocm
